<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ME Programmer">
<title>Movement Encyclopedia — Programmer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#1B2A4A;--steel:#3D5A80;--accent:#E07A5F;--warm:#F4A261;--light:#F0F4F8;--green:#2E7D32;--green-bg:#E8F5E9;--amber-bg:#FFF3E0;--gray:#666;--body:#333;--gmed:#E0E0E0;--white:#FFF;--font:'DM Sans',system-ui,-apple-system,sans-serif}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--body);background:var(--white)}
.app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto}
header{background:var(--navy);color:var(--white);padding:8px 16px 6px;flex-shrink:0}
.hdr-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hdr-title{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;opacity:.6}
.hdr-day{font-size:15px;font-weight:700}
.hdr-date{font-size:11px;opacity:.6}
.day-pills{display:flex;gap:3px;padding:4px 0 6px;overflow-x:auto;scrollbar-width:none}
.day-pills::-webkit-scrollbar{display:none}
.dpill{min-width:32px;height:34px;border-radius:6px;border:1.5px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;flex-shrink:0;transition:all .15s;position:relative;padding:1px 3px}
.dpill .dw{font-size:8px;font-weight:500;opacity:.6;line-height:1}
.dpill.active{background:var(--accent);border-color:var(--accent);color:var(--white)}
.dpill.today{border-color:var(--white)}
.dpill.has-data::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--warm)}
.dpill.active.has-data::after{background:var(--white)}
.decad-nav{display:flex;align-items:center;gap:4px;padding:2px 0}
.decad-nav button{background:none;border:none;color:rgba(255,255,255,.5);font-size:14px;cursor:pointer;padding:2px 6px}
.decad-nav button:active{color:var(--white)}
.decad-nav span{font-size:11px;font-weight:500;color:rgba(255,255,255,.6);flex:1;text-align:center}
.tally{background:var(--light);border-top:1px solid var(--gmed);padding:8px 12px;flex-shrink:0}
.tl{display:flex;flex-direction:column;gap:3px}
.tr{display:flex;align-items:center;gap:8px}
.tl-name{font-size:11px;font-weight:700;color:var(--navy);min-width:88px;white-space:nowrap}
.tl-bar{flex:1;height:5px;background:var(--gmed);border-radius:3px;overflow:hidden}
.tl-fill{height:100%;border-radius:3px;transition:width .3s;width:0}
.tl-fill.met{background:var(--green)}.tl-fill.partial{background:var(--steel)}.tl-fill.empty{background:transparent}
.tl-ct{font-size:10px;font-weight:700;min-width:28px;text-align:right}
.tl-today{font-size:9px;font-weight:700;min-width:14px;text-align:center;border-radius:3px;padding:0 2px}
.tl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--gmed)}
.rb{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--gmed);border-radius:6px;padding:3px 10px}
.rb span{font-size:11px;font-weight:700;color:var(--navy)}
.rb.warn{border-color:var(--accent)}.rb.warn span{color:var(--accent)}
.tl-tog{background:none;border:none;font-size:11px;color:var(--steel);cursor:pointer;font-weight:500;font-family:var(--font);padding:4px 0}
.tabs{display:flex;border-bottom:2px solid var(--gmed);flex-shrink:0;background:var(--white)}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.tab .badge{display:inline-block;background:var(--accent);color:var(--white);font-size:10px;min-width:18px;height:18px;line-height:18px;border-radius:9px;text-align:center;margin-left:4px;padding:0 5px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{display:none}.panel.active{display:block}
.ps{border-bottom:1px solid var(--gmed)}
.ph{display:flex;align-items:center;padding:12px 16px;cursor:pointer;gap:10px;user-select:none}
.ph:active{background:var(--light)}
.ph-a{font-size:12px;color:var(--gray);transition:transform .2s;width:16px}
.ph-a.open{transform:rotate(90deg)}
.ph-n{font-size:14px;font-weight:700;color:var(--navy);flex:1}
.ph-c{font-size:11px;color:var(--gray);background:var(--light);padding:2px 8px;border-radius:10px}
.ph-f{font-size:10px;color:var(--gray)}
.pe{display:none;padding:0 16px 12px}.pe.open{display:block}
.ei{display:flex;align-items:center;padding:10px 12px;margin:3px 0;background:var(--white);border:1px solid var(--gmed);border-radius:8px;cursor:pointer;gap:10px;transition:all .12s}
.ei:active{background:var(--light);transform:scale(.98)}
.ei.in{opacity:.4;border-style:dashed}
.ei.corr{border-left:3px solid var(--warm)}
.en{font-size:13px;font-weight:500;color:var(--body);flex:1}
.eid{font-size:10px;color:var(--gray);font-weight:700;min-width:24px}
.et{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.etg{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--light);color:var(--steel);font-weight:500}
.ep{font-size:18px;color:var(--steel);font-weight:700}
.ex-edit{font-size:10px;color:var(--steel);font-weight:700;background:var(--light);border:1px solid var(--gmed);border-radius:4px;padding:2px 6px;cursor:pointer;margin-left:4px}
.ex-edit:active{background:var(--gmed)}
.se{text-align:center;padding:60px 20px;color:var(--gray)}
.se .ico{font-size:48px;margin-bottom:12px;opacity:.3}
.se p{font-size:14px;line-height:1.5}
.si{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--gmed);gap:10px}
.sn{width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sinf{flex:1}
.sname{font-size:14px;font-weight:500;color:var(--body)}
.spats{font-size:10px;color:var(--steel);margin-top:2px}
.sr{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px 8px;font-weight:700}
.sa{padding:16px;display:flex;gap:8px;flex-wrap:wrap}
.wd{margin:0 16px}
.wd-toggle{display:flex;align-items:center;gap:8px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--gmed);user-select:none}
.wd-toggle:active{opacity:.7}
.wd-arrow{font-size:10px;color:var(--steel);transition:transform .2s}
.wd-arrow.open{transform:rotate(90deg)}
.wd-title{font-size:13px;font-weight:700;color:var(--navy)}
.wd-body{display:none;padding:12px 0}
.wd-body.open{display:block}
.wd-hint{font-size:11px;color:var(--gray);margin-bottom:8px;line-height:1.4}
.wd-area{width:100%;min-height:120px;padding:10px 12px;border:1.5px solid var(--gmed);border-radius:8px;font-size:13px;font-family:var(--font);color:var(--body);outline:none;resize:vertical;line-height:1.5;background:var(--white)}
.wd-area:focus{border-color:var(--navy)}
.wd-area::placeholder{color:var(--gmed)}
.btn{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);transition:all .12s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--navy);color:var(--white)}
.btn-o{background:var(--white);color:var(--navy);border:1.5px solid var(--navy)}
.btn-s{padding:6px 12px;font-size:11px}
.dc{margin:16px;padding:12px;background:var(--light);border-radius:8px}
.dc h3{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.cr{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:12px}
.cd{font-weight:700;color:var(--navy);min-width:36px}
.cp{color:var(--gray);flex:1;line-height:1.4}
.cc{font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;flex-shrink:0}
.cc.g{background:var(--green-bg);color:var(--green)}
.cc.m{background:var(--amber-bg);color:var(--warm)}
.cc.l{color:var(--gray);background:var(--gmed)}
.ct{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ctp{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.ctp.met{background:var(--green-bg);color:var(--green)}
.ctp.un{background:var(--light);color:var(--gray)}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.mo.show{display:flex}
.md{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-width:600px;padding:20px;max-height:80vh;overflow-y:auto}
.md h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px}
.md label{display:block;font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
.md input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--gmed);border-radius:8px;font-size:14px;font-family:var(--font);outline:none}
.md input[type=text]:focus{border-color:var(--navy)}
.md .pt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.md .ptg{padding:6px 10px;border-radius:6px;border:1.5px solid var(--gmed);font-size:11px;font-weight:700;cursor:pointer;color:var(--gray);background:var(--white)}
.md .ptg.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.md .ma{display:flex;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--white);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hdr-title">The Movement Encyclopedia — Session Builder</div>
    <div class="hdr-row">
      <div class="hdr-day" id="hdr-day">Day — / 319</div>
      <div class="hdr-date" id="hdr-date">—</div>
    </div>
    <div class="decad-nav">
      <button onclick="navDecad(-1)">&#9664;</button>
      <span id="decad-label">Decad —</span>
      <button onclick="navDecad(1)">&#9654;</button>
    </div>
    <div class="day-pills" id="day-pills"></div>
  </header>
  <div class="tally">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span id="tally-title" style="font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px">Decad — progress</span>
      <span id="tally-today" style="font-size:10px;color:var(--steel)"></span>
    </div>
    <div class="tl" id="tl"></div>
    <div class="tl-foot">
      <div class="rb" id="rb"><span id="rt">Pull : Push —</span></div>
      <button class="tl-tog" id="ttog" onclick="togTally()">Collapse</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="sTab('lib')">Library</div>
    <div class="tab" onclick="sTab('sess')">Session <span class="badge" id="sbadge" style="display:none">0</span></div>
  </div>
  <div class="content">
    <div class="panel active" id="plib"></div>
    <div class="panel" id="psess">
      <div id="slist"></div>
      <div class="wd" id="wd-wrap">
        <div class="wd-toggle" onclick="togWD()">
          <span class="wd-arrow" id="wd-arrow">&#9654;</span>
          <span class="wd-title">Workout details</span>
        </div>
        <div class="wd-body" id="wd-body">
          <div class="wd-hint">Session architecture: format, rounds, work/rest, modules, intensity design, notes on planned HR spikes or fatigue targets.</div>
          <textarea class="wd-area" id="wd-area" placeholder="EMOM 10 min: 5 pull-ups + 10 push-ups&#10;3 rounds, 60s rest between&#10;Target: controlled breath through round 2, survival round 3..." oninput="saveWD()"></textarea>
        </div>
      </div>
      <div class="sa" id="sacts" style="display:none">
        <button class="btn btn-p" onclick="doExport()">Copy</button>
        <button class="btn btn-o" onclick="doClear()">Clear</button>
      </div>
      <div class="dc" id="dctx"></div>
    </div>
  </div>
</div>
<div class="mo" id="amod">
  <div class="md">
    <h2>Add exercise</h2>
    <label>Name</label>
    <input type="text" id="aname" placeholder="Exercise name">
    <label>Movement patterns</label>
    <div class="pt" id="apats"></div>
    <label>Corrective or Structured</label>
    <div class="pt">
      <div class="ptg" onclick="tCS(this,0)">N/A</div>
      <div class="ptg on" onclick="tCS(this,1)">Structured</div>
      <div class="ptg" onclick="tCS(this,2)">Corrective</div>
    </div>
    <div class="ma">
      <button class="btn btn-p" onclick="saveCust()" style="flex:1" id="mod-save">Add to library</button>
      <button class="btn btn-o" onclick="closeMod()" style="flex:1">Cancel</button>
    </div>
    <div id="mod-del" style="display:none;margin-top:12px;text-align:center">
      <button style="background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);padding:8px" onclick="delCust()">Delete this exercise</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const PN=['Push','Pull','Hinge','Squat','Rotation','Core','Locomotion','Plyometric','Mobility','Single-leg','Carry'];
const PF=[4,4,3,3,3,4,4,3,4,4,3];
const PT=['M','M','P','P','P','M','M','P','M','M','P'];
const D1=new Date(2026,1,16),TD=319;

const EX=[
[1,'Walkout',[8,5],'b',0],[2,'Hip Flexor Stretch',[8],'b',0],[3,'Plank Hold',[5],'b',0],
[4,'Bodyweight Squat',[3,8],'b',1],[5,'Shadow Boxing',[0,4,5,6],'b',0],
[6,'Heavy Bag Work',[0,4,7,5],'h',0],[7,'Mountain Climbers',[5,6],'b',0],
[8,'Jump Squat',[7,3],'b',1],[9,'Sled Push and Drag',[0,6,2],'l',1],
[10,'Battle Ropes',[0,5],'r',0],[11,'Dips',[0],'x',0],
[12,'Explosive Step-Up',[7,9],'x',1],[13,'Dumbbell Row',[1],'d',0],
[14,'Inverted Row',[1],'p',0],[15,'Face Pull',[1],'n',0],
[16,'Band External Rotation',[1,8],'n',0],[17,'Pull-Up',[1],'p',0],
[18,'Kettlebell Swing',[2,7],'k',1],[19,'Romanian Deadlift',[2],'dk',1],
[20,'Hip Bridge',[2],'b',2],[21,'Good Morning',[2],'bn',1],
[22,"Farmer's Walk",[10,5,6],'dk',0],[23,'Suitcase Carry',[10,5,6],'dk',0],
[24,'Overhead Carry',[10,5,6],'dk',0],[25,'Foam Roller T-Spine',[8],'f',0],
[26,'Open-Book Rotation',[8,4],'b',0],[27,'Wall Slide',[8],'b',0],
[28,'Tempo Squat',[3],'b',1],[29,'Slow-Descent Split Squat',[9,3],'b',1],
[30,'Eccentric Step-Down',[9],'x',1],[31,'Dumbbell Thruster',[3,0,7],'d',1],
[32,'Running',[6,5,9],'b',1],[34,'Slam Ball Rotational Series',[4,5,7],'s',0],
[35,'Band Pull-Apart',[1],'n',0],[36,'Dumbbell Deadlift',[2,1],'d',1],
[37,'Lat-to-Front Raise Combo',[0],'d',0],
[38,'Half-Kneeling Wall Thoracic Rotation',[8],'b',0],
[39,'Treadmill Shadow Boxing',[6,4,5],'m',0],
[40,'Max-Effort Vertical Jump',[7],'b',0],
[41,'Ground Zero',[3,0,5,7,6],'b',1],[42,'Bodyweight Lunge',[9,3],'b',1],
[43,'Weighted Step-Up',[9,3],'dx',1],
[44,'The Metronome',[2,9,3,5,4],'b',1],[45,'Standing Knee-to-Elbow',[5,4,9],'b',0],
[46,'Snow Shoveling',[2,0,4,5,6,10],'o',1],[47,'Outdoor Walk',[6,8],'b',0],
[48,'Eccentric Heel Drop',[8,9],'x',2],[49,'Calf Raise',[9],'b',1],
[50,'Bench Hop-Over',[7,5],'x',0],[51,'Box Jump',[7,3],'x',1],
[52,'Slam Ball Jump Slam',[7,3,0],'s',1],
[53,'Sledgehammer Tire Strike',[4,2,7,5],'t',1],
[54,'Ab Wheel Rollout',[5],'a',0],[55,'Stair Run',[6,9,7],'b',1],
[56,'Hill Sprint',[6,7,9],'b',1],[57,'Plyo Traveling Push-Up (KB)',[0,7,5],'k',0],
[58,'Clamshell',[5,9],'n',2],[59,'Wall Ankle Mobilization',[8],'b',0],
[60,'Lateral Band Walk',[6,9],'n',2],[61,'Lacrosse Ball Plantar Roll',[8],'z',0],
[65,'Dead Hang',[1,8],'p',0],[66,'One-Arm Dumbbell Deadlift',[2,1,5],'d',1],
[67,'Spider-Man Push-Up',[0,5,4,8],'b',0],
[68,'Half-Kneeling Shoulder Press',[0,5,9],'d',1],
[69,'Quadruped Glute Kickback',[2,9],'b',2],[70,'Fire Hydrant',[5,9],'b',2],
[71,'Plate Rotation in Horse Stance',[4,3,5],'d',1],
[72,'KB Halo',[4,8],'k',0],[73,'KB Goblet Squat',[3,5],'k',1],
[74,'Scapular Pull-Up',[1],'p',0],[75,'Bear Crawl + Plate Drag',[6,5],'c',0],
[76,'Backwards Bear Crawl + Plate Drag',[6,5],'c',0],
[77,'Resisted Sprint (Plate Drag)',[7,6,2],'c',1],
[78,'Backwards Run + Plate Drag',[6,9],'c',1],
[79,'Overhead Dumbbell Carry',[10,5,6],'d',0],
[80,'Bodyweight Squat Jump',[3,7],'b',1],
[81,'Walking Lunge + Dumbbells',[9,3,10,6],'d',1],
[82,'Slant Board Squat',[3,9],'j',2],[83,'Tibialis Raise',[9,8],'i',2],
[85,'KB Goblet Squat to Halo',[3,4,5,8],'k',1],
[86,'Jump Lunge',[7,9],'b',1],[87,'Plyometric Push-Up',[0,7],'b',0],
[88,'Assault Bike',[6,5],'y',0],[89,'Burpee',[0,7,3,6,5],'b',1],
[90,'Bear Crawl',[6,5],'b',0],[91,'Jump Rope',[6,7,9],'q',1],
[92,'Banded Squat',[3],'n',1],[93,'Single-Leg RDL',[2,9,5],'bdk',1],
[94,'Handstand Push-Up',[0,5],'b',0],[95,'Banded Good Morning',[2],'n',1],
[96,'Banded Row',[1],'n',0],[97,'Back Sprint',[6,9],'b',1],
[98,'Tuck Jump',[7],'b',0],[99,'Pogo Hop',[7,9],'b',1],
[100,'Vertical Jump',[7],'b',0],[101,'Terminal Knee Extension',[9,3],'n',2],
[102,'KB Snatch',[2,1,7,5],'k',1],[103,'KB Clean',[2,1],'k',1],
[104,'Turkish Get-Up',[4,5,8,9],'k',1],[105,'KB Windmill',[4,2,8],'k',1],
[106,'Side-Lying Leg Raise',[9,5],'b',2],
];

let exs=EX.map(e=>({id:e[0],name:e[1],patterns:e[2],eq:e[3],cs:e[4]}));
let tallyOpen=true;
let S={day:1,vday:1,sess:{},cust:[],tab:'lib',op:{}};

function d2day(d){return Math.floor((d-D1)/864e5)+1}
function day2d(n){const d=new Date(D1);d.setDate(d.getDate()+n-1);return d}
function dec4(n){return Math.ceil(n/10)}
function decR(dc){const s=(dc-1)*10+1,e=dc===32?TD:Math.min(s+9,TD);return{s,e}}
function fmtD(d){const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return`${dn[d.getDay()]}, ${mn[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`}
function sD(d){return['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]}

function init(){
  ldSt();
  const t=d2day(new Date());
  S.day=Math.max(1,Math.min(t,TD));S.vday=S.day;
  if(S.cust.length)S.cust.forEach(c=>{if(!exs.find(e=>e.id===c.id))exs.push(c)});
  bLib();bTally();bAddM();ren();
}
function ldSt(){try{const r=localStorage.getItem('me-prog');if(r){const j=JSON.parse(r);if(j.sess)S.sess=j.sess;if(j.cust)S.cust=j.cust}}catch(e){}}
function svSt(){try{localStorage.setItem('me-prog',JSON.stringify({sess:S.sess,cust:S.cust}))}catch(e){}}
function gSess(d){return S.sess[d]||{ex:[],n:''}}

function ren(){rHdr();rPills();rTally();rSess();loadWD();rDctx();uBadge()}

function rHdr(){
  const d=day2d(S.vday);
  document.getElementById('hdr-day').textContent=`Day ${S.vday} / ${TD}`;
  document.getElementById('hdr-date').textContent=fmtD(d);
  document.getElementById('decad-label').textContent=`Decad ${dec4(S.vday)} of 32`;
}

function rPills(){
  const{s,e}=decR(dec4(S.vday));
  let h='';
  for(let i=s;i<=e;i++){
    const d=day2d(i),ac=i===S.vday,td=i===S.day,hd=S.sess[i]&&S.sess[i].ex.length>0;
    let c='dpill';if(ac)c+=' active';if(td)c+=' today';if(hd)c+=' has-data';
    h+=`<div class="${c}" onclick="selDay(${i})"><span class="dw">${sD(d)}</span><span>${i}</span></div>`;
  }
  document.getElementById('day-pills').innerHTML=h;
}

function bTally(){
  let h='';
  for(let i=0;i<11;i++){
    h+=`<div class="tr"><span class="tl-name">${PN[i]}</span><div class="tl-bar"><div class="tl-fill" id="f${i}"></div></div><span class="tl-today" id="t${i}"></span><span class="tl-ct" id="c${i}">0</span></div>`;
  }
  document.getElementById('tl').innerHTML=h;
}

function dayHitsPattern(day,pi){
  const ss=gSess(day);if(!ss.ex.length)return false;
  for(const id of ss.ex){
    const x=exs.find(e=>e.id===id);if(!x)continue;
    if(!x.patterns.includes(pi))continue;
    if([2,3,9].includes(pi)&&x.cs===2)continue;
    return true;
  }
  return false;
}

function rTally(){
  const dc=dec4(S.vday),{s,e}=decR(dc);
  const dayCounts=new Array(11).fill(0);
  const todayHit=new Array(11).fill(false);
  for(let d=s;d<=e;d++){
    for(let pi=0;pi<11;pi++){
      if(dayHitsPattern(d,pi)){
        dayCounts[pi]++;
        if(d===S.vday)todayHit[pi]=true;
      }
    }
  }
  for(let i=0;i<11;i++){
    const fl=PF[i],ct=dayCounts[i],pct=Math.min(100,(ct/fl)*100);
    const fe=document.getElementById('f'+i),ce=document.getElementById('c'+i),te=document.getElementById('t'+i);
    fe.style.width=pct+'%';
    fe.className='tl-fill '+(ct>=fl?'met':ct>0?'partial':'empty');
    ce.textContent=ct+'/'+fl;
    ce.style.color=ct>=fl?'var(--green)':ct>0?'var(--steel)':'var(--gray)';
    te.textContent=todayHit[i]?'\u2713':'';
    te.style.color=todayHit[i]?'var(--green)':'transparent';
  }
  const ss=gSess(S.vday);
  let pushDay=false,pullDay=false;
  ss.ex.forEach(id=>{const x=exs.find(e=>e.id===id);if(!x)return;
    if(x.patterns.includes(0))pushDay=true;
    if(x.patterns.includes(1))pullDay=true;
  });
  const re=document.getElementById('rt'),rb=document.getElementById('rb');
  const pDays=dayCounts[1],uDays=dayCounts[0];
  re.textContent=`Pull ${pDays} days : Push ${uDays} days`;
  rb.className='rb'+(uDays>0&&pDays<uDays*2?' warn':'');
  document.getElementById('tally-title').textContent=`Decad ${dc} progress`;
  const todayCount=todayHit.filter(Boolean).length;
  document.getElementById('tally-today').textContent=todayCount>0?`Today: ${todayCount}/11 patterns`:'';
}

function togTally(){
  tallyOpen=!tallyOpen;
  document.getElementById('tl').style.display=tallyOpen?'flex':'none';
  document.getElementById('ttog').textContent=tallyOpen?'Collapse':'Expand';
}

function bLib(){
  const el=document.getElementById('plib');let h='';
  for(let pi=0;pi<11;pi++){
    const xs=exs.filter(e=>e.patterns.includes(pi));
    h+=`<div class="ps"><div class="ph" onclick="togP(${pi})"><span class="ph-a" id="a${pi}">\u25B6</span><span class="ph-n">${PN[pi]}</span><span class="ph-c">${xs.length}</span><span class="ph-f">${PT[pi]==='P'?'\u2B24':'\u25CB'} ${PF[pi]} per decad</span></div><div class="pe" id="p${pi}">`;
    xs.forEach(x=>{
      const allPats=x.patterns.map(p=>PN[p]);
      const cc=x.cs===2?' corr':'';
      const isCust=S.cust.find(c=>c.id===x.id);
      h+=`<div class="ei${cc}" id="x${x.id}-${pi}" onclick="addEx(${x.id})"><span class="eid">#${x.id}</span><div style="flex:1"><div class="en">${x.name}${x.cs===2?' <span style="font-size:9px;color:var(--warm);font-weight:700">CORRECTIVE</span>':''}${isCust?' <span class="ex-edit" onclick="event.stopPropagation();editCust('+x.id+')">edit</span>':''}</div>`;
      h+=`<div class="et">`;allPats.forEach(p=>{h+=`<span class="etg">${p}</span>`});h+=`</div>`;
      h+=`</div><span class="ep">+</span></div>`;
    });
    h+=`</div></div>`;
  }
  h+=`<div style="padding:16px;text-align:center"><button class="btn btn-o btn-s" onclick="openMod()">+ Add custom exercise</button></div>`;
  el.innerHTML=h;
}

function togP(pi){
  S.op[pi]=!S.op[pi];
  const el=document.getElementById('p'+pi),ar=document.getElementById('a'+pi);
  if(S.op[pi]){el.classList.add('open');ar.classList.add('open');rHL()}
  else{el.classList.remove('open');ar.classList.remove('open')}
}

function rHL(){
  const ss=gSess(S.vday);
  exs.forEach(x=>{x.patterns.forEach(pi=>{
    const el=document.getElementById(`x${x.id}-${pi}`);
    if(el){if(ss.ex.includes(x.id))el.classList.add('in');else el.classList.remove('in')}
  })});
}

function addEx(id){
  const ss=gSess(S.vday);
  if(ss.ex.includes(id)){toast('Already in session');return}
  ss.ex.push(id);S.sess[S.vday]=ss;svSt();ren();rHL();
  const x=exs.find(e=>e.id===id);toast(`+ ${x?x.name:'Exercise'}`);
}

function rmEx(i){
  const ss=gSess(S.vday);ss.ex.splice(i,1);S.sess[S.vday]=ss;svSt();ren();rHL();
}

function rSess(){
  const ss=gSess(S.vday),el=document.getElementById('slist'),ac=document.getElementById('sacts');
  if(!ss.ex.length){el.innerHTML=`<div class="se"><div class="ico">\u25CE</div><p>No exercises yet.<br>Tap exercises in the Library to build today\u2019s session.</p></div>`;ac.style.display='none';return}
  ac.style.display='flex';let h='';
  ss.ex.forEach((id,i)=>{
    const x=exs.find(e=>e.id===id);if(!x)return;
    const pts=x.patterns.map(p=>PN[p]).join(' \u00B7 ');
    h+=`<div class="si"><span class="sn">${i+1}</span><div class="sinf"><div class="sname">${x.name} <span style="font-size:11px;color:var(--gray)">#${x.id}</span></div><div class="spats">${pts}</div></div><button class="sr" onclick="rmEx(${i})">\u2715</button></div>`;
  });
  el.innerHTML=h;
}

function rDctx(){
  const dc=dec4(S.vday),{s,e}=decR(dc);
  const el=document.getElementById('dctx');
  let h=`<h3>Decad ${dc} context</h3>`;
  const dt=new Array(11).fill(0);
  for(let d=s;d<=e;d++){
    const ss=gSess(d);if(!ss.ex.length&&d!==S.vday)continue;
    const hit=new Array(11).fill(false);
    for(let pi=0;pi<11;pi++){
      if(dayHitsPattern(d,pi)){hit[pi]=true;dt[pi]++}
    }
    const hc=hit.filter(Boolean).length,iv=d===S.vday;
    const cl=hc>=9?'g':hc>=5?'m':'l';
    const pts=hit.map((h,i)=>h?PN[i]:null).filter(Boolean).join(', ');
    h+=`<div class="cr"><span class="cd">${iv?'\u2192 ':''}D${d}</span><span class="cp">${pts||'\u2014'}</span><span class="cc ${cl}">${hc}/11</span></div>`;
  }
  h+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--gmed)"><div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px">Decad pattern totals (days hit)</div>`;
  const mc=dt.filter((c,i)=>c>=PF[i]).length;
  h+=`<div class="ct">`;
  for(let i=0;i<11;i++){h+=`<span class="ctp ${dt[i]>=PF[i]?'met':'un'}">${PN[i]} ${dt[i]}/${PF[i]}</span>`}
  h+=`</div><div style="font-size:11px;margin-top:6px;color:var(--gray)">${mc}/11 floors met</div></div>`;
  el.innerHTML=h;
}

function uBadge(){
  const ss=gSess(S.vday),b=document.getElementById('sbadge');
  if(ss.ex.length>0){b.style.display='inline-block';b.textContent=ss.ex.length}else b.style.display='none';
}

function selDay(d){S.vday=d;ren();rHL()}
function navDecad(dir){
  const dc=dec4(S.vday)+dir;if(dc<1||dc>32)return;
  S.vday=Math.min(decR(dc).s,TD);ren();rHL();
}

function sTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  if(t==='lib'){document.querySelector('.tabs .tab:first-child').classList.add('active');document.getElementById('plib').classList.add('active');rHL()}
  else{document.querySelector('.tabs .tab:last-child').classList.add('active');document.getElementById('psess').classList.add('active')}
}

function doExport(){
  const ss=gSess(S.vday);if(!ss.ex.length)return;
  const d=day2d(S.vday),dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let t=`MOVEMENT ENCYCLOPEDIA \u2014 SESSION PLAN\nDay ${S.vday} / ${TD} \u2014 ${dn[d.getDay()]}, ${fmtD(d)}\nDecad ${dec4(S.vday)}, Day ${((S.vday-1)%10)+1}\n\nEXERCISES:\n`;
  ss.ex.forEach((id,i)=>{const x=exs.find(e=>e.id===id);if(!x)return;
    t+=`${i+1}. ${x.name} (#${x.id}) \u2014 ${x.patterns.map(p=>PN[p]).join(', ')}${x.cs===2?' [CORRECTIVE]':''}\n`});
  if(ss.n&&ss.n.trim()){t+=`\nWORKOUT DETAILS:\n${ss.n.trim()}\n`}
  t+=`\nPATTERN COVERAGE (structured):\n`;
  const hit=new Array(11).fill(false);
  for(let pi=0;pi<11;pi++){hit[pi]=dayHitsPattern(S.vday,pi)}
  for(let i=0;i<11;i++)t+=`${hit[i]?'\u2705':'\u274C'} ${PN[i]}\n`;
  t+=`\n${hit.filter(Boolean).length}/11 patterns\n`;
  try{navigator.clipboard.writeText(t);toast('Copied to clipboard')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Copied to clipboard')}
}

function doClear(){if(!confirm('Clear all exercises from this day?'))return;S.sess[S.vday]={ex:[],n:''};svSt();ren();rHL()}

let wdOpen=false;
function togWD(){
  wdOpen=!wdOpen;
  document.getElementById('wd-body').classList.toggle('open',wdOpen);
  document.getElementById('wd-arrow').classList.toggle('open',wdOpen);
}
function saveWD(){
  const ss=gSess(S.vday);
  ss.n=document.getElementById('wd-area').value;
  S.sess[S.vday]=ss;svSt();
}
function loadWD(){
  const ss=gSess(S.vday);
  document.getElementById('wd-area').value=ss.n||'';
  document.getElementById('wd-wrap').style.display=ss.ex.length?'block':'none';
}

function bAddM(){
  let h='';PN.forEach((n,i)=>{h+=`<div class="ptg" onclick="tPat(this)" data-pi="${i}">${n}</div>`});
  document.getElementById('apats').innerHTML=h;
}
let nCS=1;let editId=null;
function tPat(el){el.classList.toggle('on')}
function tCS(el,v){nCS=v;el.parentElement.querySelectorAll('.ptg').forEach(t=>t.classList.remove('on'));el.classList.add('on')}

function openMod(){
  editId=null;
  document.getElementById('amod').classList.add('show');
  document.getElementById('aname').value='';
  document.getElementById('apats').querySelectorAll('.ptg').forEach(t=>t.classList.remove('on'));
  nCS=1;
  document.getElementById('mod-save').textContent='Add to library';
  document.getElementById('mod-del').style.display='none';
}

function editCust(id){
  const x=exs.find(e=>e.id===id);if(!x)return;
  editId=id;
  document.getElementById('amod').classList.add('show');
  document.getElementById('aname').value=x.name;
  document.getElementById('apats').querySelectorAll('.ptg').forEach(t=>{
    const pi=parseInt(t.dataset.pi);
    t.classList.toggle('on',x.patterns.includes(pi));
  });
  nCS=x.cs;
  document.getElementById('mod-save').textContent='Save changes';
  document.getElementById('mod-del').style.display='block';
}

function closeMod(){document.getElementById('amod').classList.remove('show');editId=null}

function saveCust(){
  const nm=document.getElementById('aname').value.trim();if(!nm){toast('Enter a name');return}
  const ps=[];document.getElementById('apats').querySelectorAll('.ptg.on').forEach(t=>ps.push(parseInt(t.dataset.pi)));
  if(!ps.length){toast('Select at least one pattern');return}

  if(editId!==null){
    const x=exs.find(e=>e.id===editId);if(x){x.name=nm;x.patterns=ps;x.cs=nCS}
    const cx=S.cust.find(c=>c.id===editId);if(cx){cx.name=nm;cx.patterns=ps;cx.cs=nCS}
    svSt();bLib();closeMod();toast(`Updated: ${nm}`);
  } else {
    const mx=Math.max(...exs.map(e=>e.id),1000);
    const nx={id:mx+1,name:nm,patterns:ps,eq:'b',cs:nCS};
    exs.push(nx);S.cust.push(nx);svSt();bLib();closeMod();toast(`Added: ${nm}`);
  }
}

function delCust(){
  if(editId===null)return;
  const x=exs.find(e=>e.id===editId);
  if(!confirm(`Delete "${x?x.name:'this exercise'}" from the library?`))return;
  exs=exs.filter(e=>e.id!==editId);
  S.cust=S.cust.filter(c=>c.id!==editId);
  Object.keys(S.sess).forEach(day=>{
    S.sess[day].ex=S.sess[day].ex.filter(id=>id!==editId);
  });
  svSt();bLib();closeMod();ren();toast('Deleted');
}

let tT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),1800)}

init();
</script>
</body>
</html>
